name: Sam's Club Inventory Checker

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes, 24/7
  workflow_dispatch: # Allows you to run it manually anytime

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # <-- Updated from v3 to v4

    - name: Set up Python
      uses: actions/setup-python@v5  # <-- Updated from v4 to v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests

    - name: Run Tracker Script
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python tracker.py
